name: Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  missiond-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout semantic-terminal dependency
        run: git clone --depth 1 --branch main https://github.com/RuoqiJin/semantic-terminal.git ../semantic-terminal

      - name: Checkout jarvis-forge dependency
        shell: bash
        env:
          JARVIS_FORGE_DEPLOY_KEY: ${{ secrets.JARVIS_FORGE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${JARVIS_FORGE_DEPLOY_KEY}" ]; then
            echo "::error title=Missing private dependency key::JARVIS_FORGE_DEPLOY_KEY is required to checkout RuoqiJin/jarvis-forge"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${JARVIS_FORGE_DEPLOY_KEY}" > ~/.ssh/missiond_jarvis_forge_deploy_key
          chmod 600 ~/.ssh/missiond_jarvis_forge_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/missiond_jarvis_forge_deploy_key -o IdentitiesOnly=yes" \
            git clone --depth 1 --branch main git@github.com:RuoqiJin/jarvis-forge.git ../jarvis-forge

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install OCaml toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ocaml opam ocaml-dune
          node scripts/check-ocaml-toolchain.mjs --json

      - name: Check storage contract
        run: |
          node scripts/check-v3-ops-infra-isomorphism.mjs --json
          node scripts/check-missiond-owned-sqlite-clean.mjs --json
          node scripts/check-v3-cli-conversation-ingestion-isomorphism.mjs --json
          node scripts/check-high-roi-contracts.mjs --json
          node scripts/check-pg-migrations-discipline.mjs --json

      - name: Ensure skill-store uses Postgres only
        run: |
          set +e
          cargo tree -p skill-store -i rusqlite > /tmp/skill-store-rusqlite.txt 2>&1
          status=$?
          set -e
          cat /tmp/skill-store-rusqlite.txt
          if [ "$status" -eq 0 ] && grep -q '^skill-store ' /tmp/skill-store-rusqlite.txt; then
            echo "skill-store must not depend on rusqlite"
            exit 1
          fi

      - name: Cargo check
        run: cargo check -p missiond-daemon -p missiond-core -p skill-store

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Install Board dependencies
        run: pnpm --dir packages/board install --frozen-lockfile

      - name: Board operator fixture check
        run: node scripts/check-board-operator-fixtures.mjs

      - name: Board typecheck
        run: pnpm --dir packages/board typecheck

      - name: Board build
        run: pnpm --dir packages/board build
