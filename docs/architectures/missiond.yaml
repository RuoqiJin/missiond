# MissionD Architecture Manifest
# AI 寻路地图 — 读此文件即可定位任何模块
# 更新时机：crate 新增/删除、trait 签名变更、数据流变更

project:
  name: missiond
  # path is intentionally unset — AI agents should use the repo they were
  # spawned inside as the implicit root; hard-coding an operator-specific
  # path here would break every other clone.
  lang: rust
  framework: tokio + axum (ws) + sqlx (sqlite/pg)
  description: "Claude Code 多实例编排系统：PTY 管理、语义解析、知识库、MCP 工具暴露"

# ── Crate 依赖拓扑 ──
# missiond-daemon ─┬─→ missiond-core (基础库)
#                  └─→ missiond-mcp  ─→ missiond-core
# missiond-runner  ─→ missiond-core
# missiond-attach  ─→ missiond-core

crates:
  missiond-core:
    path: crates/missiond-core
    role: "基础库：PTY、语义解析、DB、类型、trait 定义"
    modules:
      pty:
        role: "PTY 会话生命周期管理"
        entry: src/pty/mod.rs
        key_types: [PTYSession, PtyHandle]
      semantic:
        role: "Claude Code 终端输出语义解析"
        entry: src/semantic/mod.rs
        traits: [StateParser, ConfirmParser, TitleParser, ToolOutputParser, StatusParser]
        state_machine: [Idle, Thinking, Responding, ToolRunning, Confirming, Editing]
      db:
        role: "数据库存储层（SQLite/PostgreSQL 多引擎适配）"
        entry: src/db/mod.rs
        key_types: [KnowledgeEntry, Task]
        traits: [MissionStore]
      types:
        role: "跨 crate 共享类型"
        entry: src/types/mod.rs
        key_types: [SlotConfig, SlotId, TaskStatus, CliEngine]
      embedding:
        role: "语义向量（FastEmbed / Ollama）"
        entry: src/embedding/mod.rs
        traits: [EmbeddingProvider]
      ast:
        role: "代码结构提取（多语言 AST 剪枝）"
        entry: src/ast/mod.rs
        traits: [AstPruner]
      skill:
        role: "Skill 元数据加载"
        entry: src/skill/mod.rs
        key_types: [SkillMeta]
      ws:
        role: "WebSocket 网关（Jarvis 前端通信）"
        entry: src/ws/server.rs
      ipc:
        role: "Unix socket IPC（daemon ↔ mcp）"
        entry: src/ipc/
      sync:
        role: "远程同步（VDS 部署）"
        entry: src/sync/

  missiond-daemon:
    path: crates/missiond-daemon
    role: "主守护进程：状态管理、handler 分发、worker 任务"
    depends_on: [missiond-core, missiond-mcp]
    modules:
      handlers:
        role: "MCP 工具请求处理（20+ handler）"
        entry: src/handlers/
        pattern: "每个 MCP 工具对应一个 handler 文件"
      llm:
        role: "外部 LLM 调用（Gemini CLI / Client / Router）"
        entry: src/llm/
        key_files: [gemini_cli.rs, gemini_client.rs, router_chat.rs]
      workers:
        role: "后台任务（巡检、记忆提取、合并、策略与偏好分析）"
        entry: src/workers/
      engine:
        role: "PTY 引擎封装"
        entry: src/engine/
      context:
        role: "上下文构建（skill + kb 注入）"
        entry: src/context/
      state:
        role: "全局状态管理（AppState）"
        entry: src/state/
      events:
        role: "事件总线（EventBus）"
        entry: src/events/

  missiond-mcp:
    path: crates/missiond-mcp
    role: "MCP Server：stdio JSON-RPC 协议，暴露工具给 Claude Code"
    depends_on: [missiond-core]
    modules:
      tools:
        role: "18+ 工具定义（tool schema + dispatch）"
        entry: src/tools/
        pattern: "每个文件定义一组相关工具的 schema 和路由"
      server:
        role: "JSON-RPC 协议处理"
        entry: src/server.rs
      protocol:
        role: "MCP 协议类型"
        entry: src/protocol.rs

  missiond-runner:
    path: crates/missiond-runner
    role: "Claude CLI 包装器（启动 Claude Code 进程）"
    depends_on: [missiond-core]

  missiond-attach:
    path: crates/missiond-attach
    role: "交互式终端附着（attach 到运行中的 slot）"
    depends_on: [missiond-core]

# ── 核心 Trait 契约 ──
traits:
  StateParser:
    crate: missiond-core
    module: semantic
    contract: "终端输出 → 状态枚举（Idle/Thinking/Responding/...）"
  ConfirmParser:
    crate: missiond-core
    module: semantic
    contract: "终端输出 → 确认对话框信息（工具名、参数、选项）"
  TitleParser:
    crate: missiond-core
    module: semantic
    contract: "终端标题 → 任务名提取"
  ToolOutputParser:
    crate: missiond-core
    module: semantic
    contract: "工具输出区域 → 结构化结果"
  StatusParser:
    crate: missiond-core
    module: semantic
    contract: "状态栏 → 模型/token/cost 信息"
  EmbeddingProvider:
    crate: missiond-core
    module: embedding
    contract: "文本 → 向量，支持 FastEmbed(本地) / Ollama(远程)"
  AstPruner:
    crate: missiond-core
    module: ast
    contract: "源代码 → 骨架（保留签名、删除函数体）"
  PermissionPolicy:
    crate: missiond-daemon
    module: handlers
    contract: "工具名 + 参数 → Allow/Confirm/Deny 决策"
  MissionStore:
    crate: missiond-core
    module: db
    contract: "数据库后端抽象，隔离上层业务与底层存储（SQLite/Pg）实现"

# ── 数据流 ──
data_flows:
  mcp_request:
    description: "MCP 工具调用全链路"
    flow: "Claude Code → stdio → missiond-mcp(JSON-RPC) → IPC socket → missiond-daemon(handler) → DB/PTY/LLM → response 原路返回"

  pty_lifecycle:
    description: "PTY 会话生命周期"
    flow: "spawn(SlotConfig) → PTY 进程 → 语义解析(StateParser) → 状态事件 → 确认处理(PermissionPolicy) → 任务完成 → idle"

  knowledge_pipeline:
    description: "知识提取与演化管线"
    flow: "PTY 输出 → 实时提取(fast slot) → 深度分析(slow slot) → KB 写入 → 向量索引 → 合并去重 → 达尔文 GC(基于 utility_score 淘汰)"

  hybrid_search:
    description: "混合搜索与重排序"
    flow: "查询 → FTS5/PG全文搜索 + 向量相似度 → RRF 排序融合 → 结合时间衰减(temporal_decay)与效用分数(utility_score)重打分 → top-k 结果"

  strategy_analysis:
    description: "用户偏好与模式分析流"
    flow: "Timeline事件广播(timeline_rx) → StrategyWorker订阅 → 偏好发现与模式提取(长会话触发分块分析) → 写入KB(strategic-state)"

# ── 关键不变量 ──
invariants:
  - "一个 slot 同一时刻只处理一个任务"
  - "MCP server 是无状态的，所有状态在 daemon 侧"
  - "存储层通过 MissionStore 等 traits 抽象，隐蔽底层并发与写入机制差异"
  - "PTY 语义解析是尽力而为，不阻塞主流程"
  - "知识库写入幂等（相同 key 覆盖）"

# ── 反面模式（AI 禁止做的事）──
anti_patterns:
  - do: "在 missiond-mcp 中持有状态或缓存"
    why: "MCP 进程随 Claude Code 启停，状态必须在 daemon 侧"
  - do: "在 missiond-core 中引入 daemon 特有依赖（如 handler 逻辑）"
    why: "core 是叶子 crate，被所有上层依赖，引入上层依赖会循环"
  - do: "直接在 handler 中操作 PTY 底层字节流"
    why: "PTY 操作必须经 engine 层封装，handler 只调高层 API"
  - do: "在语义解析中使用硬编码字符串匹配替代正则/状态机"
    why: "Claude Code 输出格式会随版本变化，硬编码极易失效"
  - do: "跳过 EventBus 直接在 handler 间互调"
    why: "handler 间解耦靠事件总线，直接调用会引入隐式依赖"
  - do: "在 workers 中同步阻塞等待 LLM 响应"
    why: "LLM 调用可能耗时数分钟，必须 async + timeout"
  - do: "直接绕过状态机手动修改全局 AppState"
    why: "状态（如 Idle→Thinking）必须由事件驱动（EventBus），强行修改会导致 PTY 输出解析与实际状态脱节"
  - do: "对超长工具输出进行盲目的位置截断（如直接取前后两千字）"
    why: "会丢失中间的错误堆栈信号，必须使用语义感知截断保留带错误信号的行及其上下文"
  - do: "手动调用 slot_dispatch.release() 来释放插槽"
    why: "必须使用 SlotAcquireGuard 实现 RAII 自动释放，防止错误提早返回或 panic 导致插槽锁泄露和死锁"
  - do: "将未知的 task intent 静默降级为默认角色（如 coder）"
    why: "必须严格使用白名单校验并 fail-fast，否则会导致安全策略和资源隔离（如 ops 角色限制）被绕过"
  - do: "在业务层绕过 trait 直接使用特定的数据库原生类型（如 sqlite/pg specific）"
    why: "必须依靠 db::traits 中的抽象，以确保多后端支持和解耦"

# ── 错误处理策略（每层的 Error 职责）──
error_handling:
  missiond-core:
    error_type: "自定义 Error enum（CoreError）"
    strategy: "返回领域错误，不做 HTTP 映射，不吞错"
    rule: "所有 IO/DB 错误用 ? 向上传播，不在内部 log 后静默"
  missiond-daemon:
    error_type: "anyhow::Error 或 handler-specific Error"
    strategy: "handler 捕获 CoreError → 转 MCP ToolResult(error)"
    rule: "handler 是错误边界：记日志 + 返回结构化错误给 MCP"
  missiond-mcp:
    error_type: "JSON-RPC Error"
    strategy: "IPC 调用失败 → JSON-RPC error response（code + message）"
    rule: "不解释错误原因，透传 daemon 返回的错误信息"
  workers:
    error_type: "log + 指数退避重试"
    strategy: "后台任务失败不 panic，记日志后指数退避重试或跳过（禁止无间隔死循环重试）"
    rule: "worker 崩溃不能影响 daemon 主循环"

# ── 领域词汇表 ──
glossary:
  slot: "一个 Claude Code 实例的运行位（含 PTY + 配置 + 状态）"
  dynamic_slot: "动态运行位，支持超时自动销毁（系统重启时采取 clean slate 策略全部回收）"
  task: "分配给 slot 执行的具体工作单元"
  job_store: "全局状态(AppState)中管理异步作业/任务的内存存储映射"
  KB/知识库: "SQLite/PG 中的长期记忆存储（KnowledgeEntry 表）"
  strategic_state: "长期维护的关于用户开发轨迹、偏好模式与摩擦点的认知状态，存储在 KB 中"
  beacon: "代码库中的关键锚点，用于快速定位（文件+行号+摘要）"
  semantic_parsing: "从 PTY 终端原始输出提取结构化状态的过程"
  confirm/确认: "Claude Code 请求用户批准工具调用时的对话框"
  permission_policy: "自动批准/拒绝/等待人工确认的策略规则"
  handler: "daemon 中处理单个 MCP 工具调用的函数"
  worker: "daemon 中的后台持续任务（巡检/提取/合并/分析）"
  EventBus: "daemon 内部的异步事件发布-订阅通道"
  IPC: "daemon 与 MCP server 之间的 Unix socket 通信"
  hybrid_search: "全文(FTS5/PG) + 向量相似度 + RRF 融合的搜索模式"
  utility_score: "达尔文效用分数 [0.0, 1.0]，随访问命中增加，随时间衰减，用于决定知识条目的存活或淘汰"
  darwinian_gc: "基于 utility_score 的达尔文垃圾回收机制，取代硬编码的过期时间规则"

# ── 设计决策记录（防止 AI 自作聪明重构）──
design_rationale:
  multi_engine_db:
    decision: "从强制单机 SQLite 扩展为 SQLite / PostgreSQL 双引擎（提取 MissionStore trait）"
    why: "本地桌面继续使用 SQLite 保持零运维，而 PostgreSQL 允许在云端和大型服务化部署中获得更好的并发与生态兼容"
  wal_single_writer:
    decision: "对于 SQLite 模式使用 WAL + 单写连接"
    why: "避免 SQLITE_BUSY，写操作串行化是有意为之，并发写会导致不可预测的锁争用（Postgres 模式不受此限）"
  mcp_stateless:
    decision: "MCP server 不持有任何状态"
    why: "MCP 进程生命周期由 Claude Code 控制，随时可能被杀，状态放 daemon 才安全"
  semantic_best_effort:
    decision: "语义解析失败不阻塞主流程"
    why: "Claude Code 终端输出格式无 SLA，解析失败是常态，降级为 raw 文本继续运行"
  event_bus_decouple:
    decision: "handler 间通过 EventBus 解耦，不直接调用"
    why: "handler 数量 20+，直接互调会形成蜘蛛网依赖，EventBus 保持 O(1) 耦合度"
  ipc_over_http:
    decision: "daemon ↔ MCP 用 Unix socket IPC 而非 HTTP"
    why: "同机通信，IPC 延迟 < 1ms，HTTP 有序列化/连接开销；且 MCP 协议本身是 stdio JSON-RPC"
  dynamic_slot_recovery:
    decision: "Daemon启动时强制终止所有活跃的 dynamic slots (clean slate)，放弃状态恢复"
    why: "底层 PTY 孤儿进程会被系统级强制清理，强行在 DB 和内存中恢复 active 状态会导致与物理进程脱节的僵尸 slot"
  chunked_strategy_analysis:
    decision: "对于超长已完成会话的战略分析采用按字节预算分块处理，通过 KB 中的 strategic-state 传递分析状态"
    why: "避免 LLM 上下文超限和状态坍塌，同时复用既有水位线（watermark）实现断点续传"
  semantic_tool_truncation:
    decision: "工具输出超长时采用语义感知的截断（提取带错误信号的行及其相邻上下文），取代纯粹基于位置的头尾截断"
    why: "确保长日志（如构建或循环输出）中间夹杂的关键错误堆栈不被盲目截去，提升排错成功率"
  darwinian_knowledge_gc:
    decision: "知识库采用基于效用分数(utility_score)的达尔文回收机制，弃用硬编码过期时间"
    why: "确保经常被访问的高价值记忆（即使是很久前记录的）能永久存活，而迅速淘汰从未被命中的低质量/噪音记忆，提升检索信噪比并控制数据库体积"
  raii_slot_locking:
    decision: "使用 RAII 机制 (SlotAcquireGuard) 管理 Slot 并发分发锁"
    why: "消除并发分发任务时的 TOCTOU (Time-of-check to time-of-use) 竞争，并确保任何异常下锁均被释放"
  strict_intent_whitelist:
    decision: "对 Task Delegate 工具的 Intent 实施强制白名单拦截 (fail-fast)"
    why: "修补意图逃逸漏洞，防止静默降级导致安全策略或自动扩容配额被越权利用"
  defense_in_depth_truncation:
    decision: "在业务层和 DB 存储层实施双层上下文长度截断防御"
    why: "业务层限制 KB/Skill 注入长度防 LLM Context 爆炸，DB 层 50KB 截断兜底防止异常输入撑爆数据库"
  fatal_slot_namespace_guard:
    decision: "系统启动时强制校验静态 Slot ID 命名空间，若占用 slot-dyn- 前缀则致命退出"
    why: "防止静态配置与系统自动分配的动态插槽 ID 产生冲突，破坏孤儿进程回收与生命周期管理"
  startup_reconciliation:
    decision: "Daemon 启动时自动恢复并唤醒 stale running 的 board_tasks"
    why: "修复进程崩溃导致的内存调度信号丢失问题，避免长时间的 Watchdog 兜底延迟"