[package]
name = "missiond-pty"
version.workspace = true
edition.workspace = true
description = "PTY session management for missiond"

[dependencies]
# Internal crates
missiond-shared.workspace = true
semantic-terminal = { workspace = true }

# PTY
portable-pty = { workspace = true }

# Terminal emulation
alacritty_terminal = { workspace = true }
vte = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["sync", "time", "process", "io-util", "fs", "macros", "rt"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Image rendering (PTY screenshot)
image = { workspace = true }
ab_glyph = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
once_cell = "1.19"
regex = { workspace = true }
libc = "0.2"

[lints]
workspace = true
