[package]
name = "missiond-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core library for missiond - database, types, IPC, and Claude Code orchestration"
readme = "../../README.md"

[features]
default = ["postgres"]
postgres = ["dep:sqlx"]
embeddings = ["dep:fastembed"]
code-context = ["dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-typescript", "dep:tree-sitter-python"]

[dependencies]
# Internal crates
missiond-shared.workspace = true
semantic-terminal = { workspace = true }
missiond-pty.workspace = true

# Async runtime
tokio = { workspace = true, features = ["sync", "time", "process", "io-util", "fs", "macros", "rt"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# File watching
notify = { workspace = true }

# Directories
dirs = { workspace = true }

# Logging
tracing.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Regex
regex.workspace = true

# Utilities
uuid.workspace = true
chrono.workspace = true
base64.workspace = true
sha2 = "0.10"

# Lazy initialization
once_cell = "1.19"

# System info
gethostname = "0.5"

# Database
sqlx = { workspace = true, optional = true }

# Async trait
async-trait.workspace = true

# Embeddings (feature-gated, requires glibc — not available on MUSL)
fastembed = { workspace = true, optional = true }

# Code analysis (feature-gated, tree-sitter AST parsing)
tree-sitter = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }

# WebSocket
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
libc = "0.2.183"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
tempfile = "3.14"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "split_args"
harness = false

[lints]
workspace = true
